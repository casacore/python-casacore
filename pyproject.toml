#########################
# build-system settings #
#########################

[build-system]
requires = [
    "scikit-build-core>=0.8",
]
build-backend = "scikit_build_core.build"


####################
# project settings #
####################

[project]
name = "python-casacore"
description = "A wrapper around CASACORE, the radio astronomy library"
dynamic = ["version"]
keywords = ["pyrap", "casacore", "utilities", "astronomy"]
license = {file = "LICENSE"}
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.10"
authors = [
    {name = "Malte Marquarding", email = "Malte.Marquarding@gmail.com"},
    {name = "Ger van Diepen", email = "gervandiepen@gmail.com"},
    {name = "Gijs Molenaar", email = "gijs@pythonic.nl"},
    {name = "Tammo Jan Dijkema", email = "dijkema@astron.nl"},
    {name = "Marcel Loose", email = "loose@astron.nl"},
]
classifiers=[
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
]

[project.urls]
Homepage = "https://github.com/casacore/python-casacore"


#########################
# cibuildwheel settings #
#########################

[tool.cibuildwheel]
# Each runner builds only its native architecture: x86_64 on Linux,
# arm64 on the macOS runner.
build = "cp3{10,11,12,13,14}-*"
build-verbosity = 1
test-command = "cd {package}/tests && pytest"
test-requires = "pytest"

[tool.cibuildwheel.macos]
# before-build compiles Boost.Python and casacore against each Python version,
# the macOS analogue of the per-Python Linux images below; see the script for
# details.
before-all = "bash {project}/.github/scripts/cibw_before_all_macos.sh"
before-build = "bash {project}/.github/scripts/cibw_before_build_macos.sh"
# cibuildwheel cannot source cibw_env.sh, so these are literals. Keep the
# paths in sync with CIBW_PREFIX, CIBW_DATA and CCACHE_DIR there. CMAKE_ARGS
# routes the extension build through the same ccache as the dependencies.
environment = """ \
    CMAKE_PREFIX_PATH=$HOME/cibw/local \
    CASACORE_DATA=$HOME/cibw/measures/data \
    CCACHE_DIR=$HOME/cibw/ccache \
    CMAKE_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" \
"""
repair-wheel-command = """\
    source {project}/.github/scripts/cibw_env.sh && \
    DYLD_LIBRARY_PATH=$CIBW_PREFIX/lib delocate-wheel \
    --require-archs {delocate_archs} -w {dest_dir} -v {wheel}\
"""

[tool.cibuildwheel.linux]
skip = ["*-musllinux_*"]
# These paths exist inside the prebuilt wheel images selected below.
environment = """ \
    CXXFLAGS="-I/usr/include/cfitsio" \
    LD_LIBRARY_PATH=/opt/boost/lib \
"""

[[tool.cibuildwheel.overrides]]
select="cp310-*"
manylinux-x86_64-image = "quay.io/casacore/casacore:py310_v3.8.1"

[[tool.cibuildwheel.overrides]]
select="cp311-*"
manylinux-x86_64-image = "quay.io/casacore/casacore:py311_v3.8.1"

[[tool.cibuildwheel.overrides]]
select="cp312-*"
manylinux-x86_64-image = "quay.io/casacore/casacore:py312_v3.8.1"

[[tool.cibuildwheel.overrides]]
select="cp313-*"
manylinux-x86_64-image = "quay.io/casacore/casacore:py313_v3.8.1"

[[tool.cibuildwheel.overrides]]
select="cp314-*"
manylinux-x86_64-image = "quay.io/casacore/casacore:py314_v3.8.1"


#########################
# scikit-build settings #
#########################

[tool.scikit-build]
cmake.version = ">=3.15"
ninja.version = ">=1.5"
logging.level = "INFO"
install.components = ["data", "libraries"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.exclude = [".github", ".gitignore"]
sdist.include = ["casacore/_version.py"]
wheel.packages = ["casacore", "pyrap"]

[tool.scikit-build.cmake.define]
BUILD_TESTING = "ON"


###########################
# setuptools_scm settings #
###########################

[tool.setuptools_scm]
write_to = "casacore/_version.py"
